  <title>CarPlay Multi-Screen Dashboard</title>
  <script>
    // Smart API Fallback:
    // 1. Khi chạy ở Local (node server.js): gọi API trực tiếp trên máy tính
    // 2. Khi chạy trên GitHub Pages (web tĩnh): kết nối API online để tìm kiếm bài hát thật
    (function () {
      const ONLINE_API = 'https://duoscreen.vercel.app';

      const origFetch = window.fetch;
      window.fetch = async function (resource, init) {
        if (typeof resource === 'string' && resource.startsWith('/api/')) {
          if (window.location.protocol !== 'file:') {
            try {
              const res = await origFetch(resource, init);
              if (res.ok) return res;
            } catch (e) { }
          }
          try {
            return await origFetch(ONLINE_API + resource, init);
          } catch (e) { }
        }
        return origFetch.apply(this, arguments);
      };

      const OrigAudio = window.Audio;
      if (OrigAudio) {
        window.Audio = function (src) {
          if (typeof src === 'string' && src.startsWith('/api/')) {
            if (window.location.protocol === 'file:' || window.location.hostname.endsWith('github.io')) {
              src = ONLINE_API + src;
            }
          }
          return new OrigAudio(src);
        };
        window.Audio.prototype = OrigAudio.prototype;
      }
    })();
  </script>
