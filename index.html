          { videoId: "KnxuMH12tMM", title: "NHẠC REMIX TIKTOK TRIỆU VIEW - BXH Nhạc Trẻ Remix Hay Nhất", thumbnail: "https://i.ytimg.com/vi/KnxuMH12tMM/hq720.jpg", author: "H2O Remix", duration: "1:07:20", views: 250000, ago: "Mới nhất" },
          { videoId: "SBKL6einlO8", title: "NHẠC TREND TIKTOK REMIX | NONSTOP VIỆT MIX BASS CỰC MẠNH", thumbnail: "https://i.ytimg.com/vi/SBKL6einlO8/hq720.jpg", author: "Việt Mix TV", duration: "1:08:05", views: 180000, ago: "Mới nhất" },

          { videoId: "Q-O9t8P7E-s", title: "Tái Sinh Remix ♫ BXH Nhạc Trẻ EDM Hot Trend TRIỆU VIEW", thumbnail: "https://i.ytimg.com/vi/Q-O9t8P7E-s/hq720.jpg", author: "AT EDM", duration: "1:20:31", views: 50000000, ago: "Hot trend" }
        ];

        const origFetch = window.fetch;
        window.fetch = async function(resource, init) {
          if (typeof resource === 'string' && resource.startsWith('/api/yt-search')) {
            try {
              const res = await origFetch(resource, init);
              if (res.ok) return res;
            } catch (e) {}
            return new Response(JSON.stringify({ videos: DEFAULT_VIDEOS }), {
              status: 200,
              headers: { 'Content-Type': 'application/json' }
            });
          }
          return origFetch.apply(this, arguments);
        };
      })();
    </script>
